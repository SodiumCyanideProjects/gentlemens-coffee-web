<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="page-title"></title>


<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/favicon.png" type="image/png">

</head>


<body>

<div class="loader">

    <div class="loader-content">

        <div class="loader-title">
            GENTLEMEN'S COFFEE
        </div>

        <div class="loader-subtitle">
            MOBILE COFFEE BAR • EST. 2026
        </div>

    </div>

</div>


<header>

<nav>

<div class="logo-container">

    <div class="logo-text" id="brand-name"></div>

    <div class="logo-subtitle" id="brand-subtitle"></div>

</div>

<div class="menu">

<a href="#about">O nás</a>

<a href="#services">Naše služby</a>

<a href="#contact">Kontakt</a>

</div>


</nav>

</header>


<div class="concept-notice">
    <span class="concept-label">KONCEPT</span>
    <span>
        Tento web představuje koncept připravované mobilní kavárny.
        Služba zatím není v provozu.
    </span>
</div>





<section class="hero" id="hero">


<div class="hero-content">


<img id="logo" class="company-logo">


<h1 id="slogan"></h1>


<p id="hero-text"></p>


<a href="#contact" class="hero-button" id="hero-button"></a>


</div>


</section>







<section id="about" class="about hidden">


<h2 id="about-title"></h2>


<div class="about-content">


<div class="text" id="about-text"></div>



<div class="gallery">


<img id="about-image1">

<img id="about-image2">


</div>


</div>


</section>







<section id="services" class="services hidden">


<h2 id="services-title"></h2>


<div class="service-container" id="services-container">


</div>


</section>







<section id="contact" class="contact hidden">


<h2 id="contact-title"></h2>


<div class="contact-box">


<p id="contact-intro"></p>

<p id="contact-company"></p>

<p class="contact-item">
    <img src="images/phone.svg" alt="Telefon">
    <span id="contact-phone"></span>
</p>

<p class="contact-item">
    <img src="images/email.svg" alt="Email">
    <span id="contact-email"></span>
</p>


</div>


</section>








<footer>


<p>
© 2026 Gentlemen's Coffee. Všechna práva vyhrazena.
</p>


<p id="footer-text"></p>


</footer>





<script src="data.js"></script>

<script src="script.js"></script>


</body>


</html>
